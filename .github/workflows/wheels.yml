name: Wheels

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - macos-13           # x86_64
          - macos-14           # arm64
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      # Builds a single cp39-abi3 wheel per platform; the matrix is one job
      # per platform rather than one per Python version.
      - uses: pypa/cibuildwheel@v4

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pipx run build --sdist
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # The point of abi3: one wheel built on 3.9 must import and pass on every
  # later interpreter. Nothing else in CI checks this, because cibuildwheel
  # only tests the wheel on the version it was built with.
  abi3:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - name: Install the cp39-abi3 wheel and run the suite
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --only-binary=:all: wheelhouse/*.whl
          python -c "import parallelbrot as p; print(p.__version__, p.compiled_backends(), 'openmp=', p.has_openmp())"
          pytest tests -q
