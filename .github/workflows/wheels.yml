name: Wheels

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish the built artifacts to TestPyPI'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - macos-15-intel     # x86_64
          - macos-15           # arm64
          - windows-latest
    steps:
      - uses: actions/checkout@v5

      # Builds a single cp39-abi3 wheel per platform; the matrix is one job
      # per platform rather than one per Python version.
      - uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pipx run build --sdist
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # The point of abi3: one wheel built on 3.9 must import and pass on every
  # later interpreter. Nothing else in CI checks this, because cibuildwheel
  # only tests the wheel on the version it was built with.
  abi3:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - name: Install the cp39-abi3 wheel and run the suite
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --only-binary=:all: wheelhouse/*.whl
          python -c "import parallelbrot as p; print(p.__version__, p.compiled_backends(), 'openmp=', p.has_openmp())"
          pytest tests -q

  # Both publish jobs use trusted publishing: PyPI verifies this workflow's
  # OIDC identity, so there is no API token stored anywhere. Each needs a
  # matching publisher registered on the index, and the environment name
  # below must match the one configured there.
  testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist, abi3]
    if: inputs.publish_testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/parallelbrot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist, abi3]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parallelbrot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      # The version lives in meson.build, so a mistyped tag would otherwise
      # publish under a version nobody asked for. Checking against the built
      # sdist filename catches the mismatch before upload.
      - name: Check the tag matches the built version
        run: |
          expected="parallelbrot-${GITHUB_REF_NAME#v}.tar.gz"
          if [ ! -f "dist/$expected" ]; then
            echo "Tag $GITHUB_REF_NAME expects dist/$expected, which was not built."
            echo "Bump version in meson.build, or retag. Built artifacts:"
            ls dist
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
