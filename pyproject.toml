[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.15", "meson>=1.3"]

[project]
name = "parallelbrot"
dynamic = ["version"]                 # taken from meson.build
description = "GPU-accelerated Mandelbrot renderer with CPU, OpenCL and CUDA backends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Pratham Hole", email = "prathamhole.dev@gmail.com" }]
keywords = ["mandelbrot", "fractal", "opencl", "cuda", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/prathamhole/parallelbrot"
Source = "https://github.com/prathamhole/parallelbrot"

[tool.meson-python]
# Tags the wheel cp39-abi3 instead of cp3XX-cp3XX. meson.build's limited_api
# only names the file; this is what meson-python reads to set the tag.
limited-api = true

[tool.meson-python.args]
setup = ["-Dopencl=auto", "-Dopenmp=auto"]
