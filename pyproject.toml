[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.15", "meson>=1.3"]

[project]
name = "parallelbrot"
dynamic = ["version"]                 # taken from meson.build
description = "GPU-accelerated Mandelbrot renderer with CPU, OpenCL and CUDA backends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Pratham Hole", email = "prathamhole.dev@gmail.com" }]
keywords = ["mandelbrot", "fractal", "opencl", "cuda", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.21"]

[dependency-groups]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/prathamhole14/parallelbrot"
Source = "https://github.com/prathamhole14/parallelbrot"

[tool.meson-python]
# Tags the wheel cp39-abi3 instead of cp3XX-cp3XX. meson.build's limited_api
# only names the file; this is what meson-python reads to set the tag.
limited-api = true

[tool.cibuildwheel]
# One cp39-abi3 wheel per platform covers 3.9 onwards. The interpreter tag
# follows the building Python, so this must stay pinned to the oldest
# supported version — building on 3.13 would emit cp313-abi3, which pip
# refuses to install on anything older.
build = "cp39-*"
skip = "*_i686 *-win32 *-musllinux_*"
build-frontend = "build"

# OpenCL is deliberately left out of PyPI wheels. Linking it adds a hard
# NEEDED entry on libOpenCL.so.1, so `import parallelbrot` would fail on any
# machine without an ICD loader, including CPU-only users. The GPU backends
# ship via conda-forge, where the loader is a declarable dependency.
config-settings = { setup-args = "-Dopencl=disabled" }

test-requires = "pytest"
test-command = [
    "pytest {project}/tests",
    "python -c \"import parallelbrot as p; print(p.compiled_backends(), 'openmp=', p.has_openmp())\"",
]

[tool.cibuildwheel.linux]
# manylinux ships GCC, so libgomp is present; auditwheel vendors it into the
# wheel. No excludes needed once OpenCL is out of the picture.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Apple Clang has no built-in OpenMP. Without libomp the build still succeeds
# (the feature is `auto`) but renders single-threaded, so install it and let
# delocate vendor it into the wheel.
before-all = "brew install libomp"

# Homebrew's libomp bottle is built for a newer macOS than cibuildwheel's
# default wheel target, and delocate refuses to vendor a library whose
# minimum exceeds the wheel tag. Raise the floor to match the bottle rather
# than give up the ~13x OpenMP speedup, which on macOS is the whole package:
# PyPI wheels carry no GPU backend. Bump these when Homebrew moves.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.windows]
# cibuildwheel does not repair Windows wheels by default.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
